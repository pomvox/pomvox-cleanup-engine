name: SDK CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core, installer, lifecycle and sanitizers
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Test all core configurations
        run: python3 scripts/check.py --sanitizers --repeat 20 --build-dir "$RUNNER_TEMP/checks"
      - name: Verify standalone package export
        run: python3 scripts/export-mlx-release.py "$RUNNER_TEMP/mlx-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-checks
          path: |
            ${{ runner.temp }}/checks/*.log
            ${{ runner.temp }}/checks/checks.json
          retention-days: 14
  consumer:
    name: Xcode MLX consumer build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - run: xcodegen generate --spec Examples/Consumer/project.yml
      - name: Build consumer and model test bundle (no model download)
        run: >-
          xcodebuild -project Examples/Consumer/CleanupConsumer.xcodeproj
          -scheme Consumer -configuration Debug -derivedDataPath "$RUNNER_TEMP/consumer"
          -destination 'platform=macOS,arch=arm64' build-for-testing
