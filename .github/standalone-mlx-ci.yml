name: MLX Package CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mlx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumer:
    name: Remote dependency and Metal consumer build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - run: brew install xcodegen
      - name: Consume the runtime remotely at the exact pushed commit
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          p = Path('Examples/Consumer/project.yml')
          s = p.read_text()
          assert s.count('    path: ../..\n') == 1
          p.write_text(s.replace('    path: ../..\n',
              '    url: https://github.com/pomvox/pomvox-cleanup-mlx.git\n'
              '    revision: ' + os.environ['GITHUB_SHA'] + '\n'))
          PYTHON
      - run: xcodegen generate --spec Examples/Consumer/project.yml
      - name: Build with the tagged public core dependency
        run: >-
          xcodebuild -project Examples/Consumer/CleanupConsumer.xcodeproj
          -scheme Consumer -configuration Debug -derivedDataPath "$RUNNER_TEMP/consumer"
          -destination 'platform=macOS,arch=arm64' build-for-testing
      - name: Verify resolved runtime, core and tokenizer identities
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          pins = json.loads(Path('Examples/Consumer/CleanupConsumer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved').read_text())['pins']
          pins = {p['identity']: p for p in pins}
          assert pins['pomvox-cleanup-mlx']['state']['revision'] == os.environ['GITHUB_SHA']
          assert pins['pomvox-cleanup-engine']['state']['version'] == Path('VERSION').read_text().strip()
          assert pins['swift-tokenizers']['state']['version'] == '0.5.0'
          assert all(p['kind'] == 'remoteSourceControl' for p in pins.values())
          PYTHON
