name: MLX Package CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mlx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumer:
    name: Remote dependency and Metal consumer build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - run: brew install xcodegen
      - run: xcodegen generate --spec Examples/Consumer/project.yml
      - name: Build with the tagged public core dependency
        run: >-
          xcodebuild -project Examples/Consumer/CleanupConsumer.xcodeproj
          -scheme Consumer -configuration Debug -derivedDataPath "$RUNNER_TEMP/consumer"
          -destination 'platform=macOS,arch=arm64' build-for-testing
