# XcodeGen spec for the local reference server example. An Xcode build is needed
# so mlx-swift's Metal shader library is packaged; a plain `swift build` is not enough.
#   xcodegen generate --spec Examples/LocalServer/project.yml
#   xcodebuild -project Examples/LocalServer/LocalServer.xcodeproj -scheme LocalServer \
#     -configuration Release -derivedDataPath /tmp/pomvox-local-server \
#     -destination 'platform=macOS,arch=arm64' build
name: LocalServer
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  PomvoxCleanupMLX:
    path: ../../Runtime/MLX
  PomvoxDiarizationFluid:
    path: ../../Runtime/Diarization
  PomvoxCleanup:
    path: ../..
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.15.5"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  LocalServer:
    type: tool
    platform: macOS
    sources:
      - Sources/LocalServer
    dependencies:
      - package: PomvoxCleanupMLX
      - package: PomvoxDiarizationFluid
        product: PomvoxDiarizationFluid
      - package: PomvoxCleanup
        product: PomvoxNotes
      - package: PomvoxCleanup
        product: PomvoxCleanupCloud
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_NAME: LocalServer
schemes:
  LocalServer:
    build:
      targets:
        LocalServer: all
